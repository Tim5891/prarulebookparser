[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "prarulebook"
version = "0.0.1"
description = "Scraper for the Prudential Regulation Authority rulebook"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3"}
authors = [
    {name = "Eryk Walczak", email = "erykjwalczak@gmail.com"}
]
keywords = ["scraping", "pra", "rulebook", "regulations"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "pandas>=1.3.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Repository = "https://github.com/tim5891/prarulebookparser"
Issues = "https://github.com/tim5891/prarulebookparser/issues"
